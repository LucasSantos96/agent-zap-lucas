name: wuzapi-agent-zap
services:
  wuzapi:
    container_name: wuzapi-agent
    image: asternic/wuzapi:sha-9487eca
    restart: always
    ports:
      - "8088:8080"
    environment:
      WUZAPI_ADMIN_TOKEN: ${WUZAPI_ADMIN_TOKEN:-dev-admin-token}
    volumes:
      - wuzapi-agent:/app/dbdata

  postgres:
    container_name: db-agent
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: db_agent
    ports:
      - "5445:5432"
    volumes:
      - db-agent-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-agent-data:
  wuzapi-agent: